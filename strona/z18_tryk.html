<!DOCTYPE html>   
<head>    
<title> Użycie fukcji - Tryksza </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 
function suma_try(a, b) { 
return a + b; 
} 
function roznica_try(a, b) { 
return a - b;
}
function iloczyn_try(a, b) { 
return a * b; 
}
function iloraz_try(a, b) {
return a / b;
}
function kwadrat1_try(a, b) {
    return a*a;
}
function kwadrat2_try(a, b) {
    return b*b;
}
function reszta_z_dzielenia_try(a, b) {
    return a % b;
}
document.write("suma="+suma_try(a,b)+"<br>"); 
document.write("roznica="+roznica_try(a,b)+"<br>"); 
document.write("iloczyn="+iloczyn_try(a,b)+"<br>"); 
document.write("iloraz="+iloraz_try(a,b)+"<br>");
document.write("kwadrat="+kwadrat1_try(a,b)+"<br>"); 
document.write("kwadrat="+kwadrat2_try(a,b)+"<br>");
document.write("reszta z dzielenia"+a+" i "+b+"= "+reszta_z_dzielenia_try(a,b)+"<br>");
</script> 
</div> 
</body> 
</html>
