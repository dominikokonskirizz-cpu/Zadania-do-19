<html><textarea cols="150" rows="100"><html>
<head>
    <title>Proste obliczenia - Tryksza</title>
</head>
<body>
    <div style="color:rgb(19, 6, 138);font-size:50px;">
<script language="JavaScript">
var liczba1=prompt("A=","");
var A_try=parseFloat(liczba1);
var liczba2=prompt("B=","");
var B_try=parseFloat(liczba2);
m=A_try*A_try*A_try+3*A_try*A_try*B_try+3*A_try*B_try*B_try+B_try*B_try*B_try;
document.write("Wzor skroconego mnozenia:<br>");
document.write("("+A_try+"+"+B_try+")^3="+A_try+"^3+3*"+A_try+"^2*"+B_try+"+3*"+A_try+"*"+B_try+"^2+"+B_try+"^3<br>");
document.write("Wzor="+m+"<br>");
</script>
</div> 
</body>
</html></textarea></html>
